plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ncrp.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.ncrp.launcher"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0-NCRP"
    }

    signingConfigs {
        release {
            storeFile file("ncrp-release-key.jks")
            storePassword "ncrp123456"
            keyAlias "ncrp_key"
            keyPassword "ncrp123456"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
