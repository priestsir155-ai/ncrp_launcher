name: Build NCRP Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Prepare & Repair All NCRP Android Project Files
        run: |
          python3 -c "import gzip, base64; exec(gzip.decompress(base64.b64decode('')).decode('utf-8'))"

      - name: Generate Android Signing Keystore
        run: |
          mkdir -p app
          rm -f app/ncrp-release-key.jks
          keytool -genkeypair -v \
            -keystore app/ncrp-release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias ncrp_key \
            -storepass ncrp123456 \
            -keypass ncrp123456 \
            -dname "CN=Neon City Roleplay, OU=NCRP, O=NCRP, L=Thrissur, ST=Kerala, C=IN"

      - name: Install Gradle 8.7 & Build Signed NCRP APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle-8.7.zip
          unzip -q gradle-8.7.zip
          ./gradle-8.7/bin/gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk NCRP_Mobile_Launcher.apk
          ls -lh NCRP_Mobile_Launcher.apk

      - name: Upload NCRP_Mobile_Launcher.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCRP_Mobile_Launcher_APK
          path: NCRP_Mobile_Launcher.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0
          name: "NCRP Mobile Launcher APK (Latest)"
          body: "Download and install **NCRP_Mobile_Launcher.apk** on your Android phone to play on **NEON CITY ROLEPLAY (15.235.128.112:7047)**."
          files: NCRP_Mobile_Launcher.apk
