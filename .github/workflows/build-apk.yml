          PYEOF
          git config user.name "github-actions[bot]" || true
          git config user.email "github-actions[bot]@users.noreply.github.com" || true
          git add launcher_config.json || true
          git diff --staged --quiet || (git commit -m "Update launcher_config.json v3.1 [skip ci]" && git push origin HEAD || true)

      - name: Fetch Real SA-MP Android Base & Game Cache
        run: |
          git clone --depth 1 https://github.com/MTHS1901/SAMP-MOBILE.git /tmp/samp_base || true
          if [ -f "/tmp/samp_base/SAMP-Cache.zip" ]; then
            cp -f /tmp/samp_base/SAMP-Cache.zip ncrp_game_cache.zip
            ls -lh ncrp_game_cache.zip
          fi

      - name: Ensure Android SDK 34
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
            unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Android Signing Keystore
        run: |
          mkdir -p app
          rm -f app/ncrp-release-key.jks
          keytool -genkeypair -v \
            -keystore app/ncrp-release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias ncrp_key \
            -storepass ncrp123456 \
            -keypass ncrp123456 \
            -dname "CN=Neon City Roleplay, OU=NCRP, O=NCRP, L=Thrissur, ST=Kerala, C=IN"

      - name: Build NCRP APK & Bundle Real SA-MP Native Game Engine
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle-8.7.zip
          unzip -q -o gradle-8.7.zip
          ./gradle-8.7/bin/gradle assembleRelease -x lint -x lintVitalRelease --no-daemon --stacktrace
          cp -f app/build/outputs/apk/release/app-release.apk NCRP_Mobile_Launcher.apk

          python3 - << 'PYEOF'
          import zipfile, os, traceback

          src_apk = "app/build/outputs/apk/release/app-release.apk"
          donor_apk = "/tmp/samp_base/SAMP_MTHS1901_b.0.0.1.apk"
          clean_apk = "/tmp/unsigned_merged.apk"

          if os.path.exists(donor_apk) and zipfile.is_zipfile(donor_apk):
              try:
                  with zipfile.ZipFile(src_apk, "r") as zin,                        zipfile.ZipFile(donor_apk, "r") as zdonor,                        zipfile.ZipFile(clean_apk, "w") as zout:

                      written = set()
                      for item in zin.infolist():
                          fn = item.filename
                          if fn.startswith("META-INF/") and (fn.endswith(".SF") or fn.endswith(".RSA") or fn.endswith(".DSA") or fn == "META-INF/MANIFEST.MF"):
                              continue
                          data = zin.read(fn)
                          if fn.endswith(".so") or fn == "resources.arsc":
                              info = zipfile.ZipInfo(fn)
                              info.compress_type = zipfile.ZIP_STORED
                              zout.writestr(info, data)
                          else:
                              zout.writestr(item, data)
                          written.add(fn)

                      for item in zdonor.infolist():
                          fn = item.filename
                          if fn == "classes.dex":
                              info = zipfile.ZipInfo("classes2.dex")
                              info.compress_type = zipfile.ZIP_DEFLATED
                              zout.writestr(info, zdonor.read(fn))
                              written.add("classes2.dex")
                              print("Bundled donor GTASA engine classes2.dex!")
                          elif fn.startswith("lib/armeabi-v7a/") and fn.endswith(".so") and fn not in written:
                              info = zipfile.ZipInfo(fn)
                              info.compress_type = zipfile.ZIP_STORED
                              zout.writestr(info, zdonor.read(fn))
                              written.add(fn)
                              print("Bundled native engine library:", fn)
                          elif fn.startswith("assets/") and not fn.endswith("/") and fn not in written:
                              info = zipfile.ZipInfo(fn)
                              info.compress_type = zipfile.ZIP_DEFLATED
                              zout.writestr(info, zdonor.read(fn))
                              written.add(fn)
                  print("Successfully created merged unsigned APK:", os.path.getsize(clean_apk))
              except Exception:
                  traceback.print_exc()
          PYEOF

          if [ -f "/tmp/unsigned_merged.apk" ]; then
            BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
            "$BUILD_TOOLS_DIR/zipalign" -f -p 4 /tmp/unsigned_merged.apk /tmp/aligned_ncrp.apk && \
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks app/ncrp-release-key.jks \
              --ks-key-alias ncrp_key \
              --ks-pass pass:ncrp123456 \
              --key-pass pass:ncrp123456 \
              --out NCRP_Mobile_Launcher.apk \
              /tmp/aligned_ncrp.apk || echo "Using Gradle-signed APK fallback"
          fi
          ls -lh NCRP_Mobile_Launcher.apk

      - name: Upload NCRP_Mobile_Launcher.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCRP_Mobile_Launcher_APK
          path: NCRP_Mobile_Launcher.apk

      - name: Publish APK & Real Game Cache to GitHub Releases (v3.0)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v3.0
          name: "NCRP Mobile Launcher v3.0 (Integrated SA-MP Engine + Real Game Cache)"
          body: "Full All-in-One **NCRP_Mobile_Launcher.apk** with embedded GTA:SA + SA-MP Native Game Engine (`libGTASA.so` + `libsamp.so`) and automatic startup download of **`ncrp_game_cache.zip`** for **NEON CITY ROLEPLAY (15.235.128.112:7047)**."
          files: |
            NCRP_Mobile_Launcher.apk
            ncrp_game_cache.zip
