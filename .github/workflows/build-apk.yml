      - name: Clone Real SA-MP 2.10 (ARM64 + ARM32) Base & Game Cache
        run: |
          git clone --depth 1 https://github.com/MTHS1901/SAMP-MOBILE.git /tmp/samp_base
          git clone --depth 1 https://github.com/noobcooder-sys/SA-MP-Mobile-Client-GTA-SA-2.10-.git /tmp/samp_210 || git clone --depth 1 -b GTA-2.10 https://github.com/kuzia15/SAMP-Mobile.git /tmp/samp_210 || true
          ls -la /tmp/samp_base/ /tmp/samp_210/ || true
          python3 - << 'PYEOF'
          import os, re, glob, shutil, zipfile

          os.makedirs("app/src/main/jniLibs/armeabi-v7a", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)

          # 0. Patch C++ IP & Port (15.235.128.112:7047) in SA-MP 2.10 source if cloned
          if os.path.exists("/tmp/samp_210/app/src/main/cpp"):
              for root, _, files in os.walk("/tmp/samp_210/app/src/main/cpp"):
                  for fn in files:
                      if fn.endswith((".cpp", ".h", ".hpp", ".c")):
                          p = os.path.join(root, fn)
                          try:
                              with open(p, "r", encoding="utf-8", errors="ignore") as f:
                                  txt = f.read()
                              orig = txt
                              txt = re.sub(r'(#define\s+SERVER_HOST\w*\s+)"[^"]*"', r'\g<1>"15.235.128.112"', txt)
                              txt = re.sub(r'(#define\s+SERVER_PORT\w*\s+)\d+', r'\g<1>7047', txt)
                              txt = txt.replace('"127.0.0.1"', '"15.235.128.112"').replace('7777', '7047')
                              if orig != txt:
                                  with open(p, "w", encoding="utf-8") as f:
                                      f.write(txt)
                                  print("Patched NCRP IP 15.235.128.112:7047 in:", p)
                          except Exception:
                              pass

          # Copy any prebuilt jniLibs from /tmp/samp_210 if present
          for abi in ["armeabi-v7a", "arm64-v8a"]:
              for cand in [f"/tmp/samp_210/app/src/main/jniLibs/{abi}", f"/tmp/samp_210/app/libs/{abi}"]:
                  if os.path.exists(cand):
                      os.makedirs(f"app/src/main/jniLibs/{abi}", exist_ok=True)
                      for fn in os.listdir(cand):
                          if fn.endswith(".so"):
                              shutil.copy2(os.path.join(cand, fn), f"app/src/main/jniLibs/{abi}/{fn}")
                              print(f"Copied 2.10 {abi} lib:", fn)

          # 1. Extract libGTASA.so, libsamp.so, libbass.so, libImmEmulatorJ.so, assets/, and classes.dex from real SA-MP APK
          donor_apk = "/tmp/samp_base/SAMP_MTHS1901_b.0.0.1.apk"
          with zipfile.ZipFile(donor_apk, "r") as zf:
              for item in zf.infolist():
                  name = item.filename
                  if name.startswith("lib/armeabi-v7a/") and name.endswith(".so"):
                      so_name = os.path.basename(name)
                      out_so = os.path.join("app/src/main/jniLibs/armeabi-v7a", so_name)
                      with open(out_so, "wb") as f:
                          f.write(zf.read(name))
                      print("Bundled native engine library:", out_so, os.path.getsize(out_so))
                  elif name.startswith("assets/") and not name.endswith("/"):
                      rel = name[len("assets/"):]
                      out_asset = os.path.join("app/src/main/assets", rel)
                      os.makedirs(os.path.dirname(out_asset), exist_ok=True)
                      if not os.path.exists(out_asset):
                          with open(out_asset, "wb") as f:
                              f.write(zf.read(name))
                  elif name == "classes.dex":
                      with open("/tmp/donor_gtasa_classes.dex", "wb") as f:
                          f.write(zf.read(name))
                      print("Extracted donor GTASA engine classes.dex:", os.path.getsize("/tmp/donor_gtasa_classes.dex"))

          # 2. Build normalized ncrp_game_cache.zip from real SAMP-Cache.zip + user ncrp_custom_pack.zip
          donor_cache = "/tmp/samp_base/SAMP-Cache.zip"
          out_cache = "ncrp_game_cache.zip"
          ini_content = (
              "[client]\n"
              "name = Neon_Citizen\n"
              "host = 15.235.128.112\n"
              "port = 7047\n"
              "password = \n\n"
              "[debug]\n"
              "debug = false\n"
              "online = true\n\n"
              "[gui]\n"
              "Font = Arial.ttf\n"
              "FontSize = 30.0\n"
              "FontOutline = 1\n"
              "ChatPosX = 325.0\n"
              "ChatPosY = 25.0\n"
              "ChatSizeX = 1150.0\n"
              "ChatSizeY = 220.0\n"
              "ChatMaxMessages = 8\n"
              "HealthBarWidth = 100.0\n"
              "HealthBarHeight = 10.0\n"
          )

          with zipfile.ZipFile(out_cache, "w", zipfile.ZIP_DEFLATED) as out_zf:
              seen = set()
              if os.path.exists(donor_cache):
                  with zipfile.ZipFile(donor_cache, "r") as in_zf:
                      for info in in_zf.infolist():
                          if info.is_dir():
                              continue
                          clean_name = info.filename.replace("\\", "/")
                          if clean_name.startswith("com.rockstargames.gtasa/files/"):
                              clean_name = clean_name[len("com.rockstargames.gtasa/files/"):]
                          elif clean_name.startswith("files/"):
                              clean_name = clean_name[len("files/"):]
                          if not clean_name or clean_name == "SAMP/settings.ini":
                              continue
                          out_zf.writestr(clean_name, in_zf.read(info.filename))
                          seen.add(clean_name)

              if os.path.exists("ncrp_custom_pack.zip"):
                  with zipfile.ZipFile("ncrp_custom_pack.zip", "r") as cust_zf:
                      for info in cust_zf.infolist():
                          if not info.is_dir() and info.filename not in seen:
                              out_zf.writestr(info.filename, cust_zf.read(info.filename))
                              seen.add(info.filename)

              out_zf.writestr("SAMP/settings.ini", ini_content)

          print("Built real ncrp_game_cache.zip:", os.path.getsize(out_cache), "bytes with", len(seen), "files!")

          # Verify ABI completeness: only keep arm64-v8a if both libGTASA.so and libsamp.so exist for arm64-v8a
          arm64_dir = "app/src/main/jniLibs/arm64-v8a"
          if not (os.path.exists(f"{arm64_dir}/libGTASA.so") and os.path.exists(f"{arm64_dir}/libsamp.so")):
              shutil.rmtree(arm64_dir, ignore_errors=True)
              with open("app/build.gradle", "r") as f:
                  bg = f.read()
              bg = bg.replace('abiFilters "armeabi-v7a", "arm64-v8a"', 'abiFilters "armeabi-v7a"')
              with open("app/build.gradle", "w") as f:
                  f.write(bg)
              print("Configured complete 32-bit armeabi-v7a native engine bundle (libGTASA.so + libsamp.so + libbass.so + libImmEmulatorJ.so)")
          PYEOF

      - name: Ensure Android SDK 34
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
            unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Android Signing Keystore
        run: |
          mkdir -p app
          rm -f app/ncrp-release-key.jks
          keytool -genkeypair -v \
            -keystore app/ncrp-release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias ncrp_key \
            -storepass ncrp123456 \
            -keypass ncrp123456 \
            -dname "CN=Neon City Roleplay, OU=NCRP, O=NCRP, L=Thrissur, ST=Kerala, C=IN"

      - name: Build APK, Inject GTASA Engine Dex, Align & Sign
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle-8.7.zip
          unzip -q gradle-8.7.zip
          ./gradle-8.7/bin/gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk /tmp/unsigned_merged.apk

          python3 - << 'PYEOF'
          import zipfile, os
          apk_path = "/tmp/unsigned_merged.apk"
          donor_dex = "/tmp/donor_gtasa_classes.dex"
          if os.path.exists(donor_dex):
              with zipfile.ZipFile(apk_path, "a", zipfile.ZIP_DEFLATED) as zf:
                  if "classes2.dex" not in zf.namelist():
                      zf.write(donor_dex, "classes2.dex")
                      print("Injected classes2.dex (GTASA + NvEventQueueActivity) into APK!")
          PYEOF

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 /tmp/unsigned_merged.apk /tmp/aligned_ncrp.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks app/ncrp-release-key.jks \
            --ks-key-alias ncrp_key \
            --ks-pass pass:ncrp123456 \
            --key-pass pass:ncrp123456 \
            --out NCRP_Mobile_Launcher.apk \
            /tmp/aligned_ncrp.apk
          ls -lh NCRP_Mobile_Launcher.apk ncrp_game_cache.zip

      - name: Upload NCRP_Mobile_Launcher.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCRP_Mobile_Launcher_APK
          path: NCRP_Mobile_Launcher.apk

      - name: Publish APK & Real Game Cache to GitHub Releases (v3.0)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v3.0
          name: "NCRP Mobile Launcher v3.0 (Integrated SA-MP Engine + Real Game Cache)"
          body: "Full All-in-One **NCRP_Mobile_Launcher.apk** with embedded GTA:SA + SA-MP Native Game Engine (`libGTASA.so` + `libsamp.so`) and automatic startup download of **`ncrp_game_cache.zip`** for **NEON CITY ROLEPLAY (15.235.128.112:7047)**."
          files: |
            NCRP_Mobile_Launcher.apk
            ncrp_game_cache.zip
