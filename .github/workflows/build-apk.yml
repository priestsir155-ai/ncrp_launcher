          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add launcher_config.json
          git diff --staged --quiet || (git commit -m "Clean launcher_config.json [skip ci]" && git push origin HEAD || true)

      - name: Ensure Android SDK 34
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
            unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Android Signing Keystore
        run: |
          mkdir -p app
          rm -f app/ncrp-release-key.jks
          keytool -genkeypair -v \
            -keystore app/ncrp-release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias ncrp_key \
            -storepass ncrp123456 \
            -keypass ncrp123456 \
            -dname "CN=Neon City Roleplay, OU=NCRP, O=NCRP, L=Thrissur, ST=Kerala, C=IN"

      - name: Build Signed NCRP APK with Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle-8.7.zip
          unzip -q gradle-8.7.zip
          ./gradle-8.7/bin/gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk NCRP_Mobile_Launcher.apk
          ls -lh NCRP_Mobile_Launcher.apk

      - name: Upload NCRP_Mobile_Launcher.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCRP_Mobile_Launcher_APK
          path: NCRP_Mobile_Launcher.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v2.0
          name: "NCRP Mobile Launcher v2.0 (Portrait Edition)"
          body: "Download and install **NCRP_Mobile_Launcher.apk** (v2.0 Portrait UI with Full Settings & Auto-Skin Updater) for **NEON CITY ROLEPLAY (15.235.128.112:7047)**."
          files: NCRP_Mobile_Launcher.apk
